<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolify Enterprise - Multi-Company ERP System</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Styling */
        header {
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area h1 {
            color: var(--primary);
            font-size: 1.8rem;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .company-setup-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .company-setup-box input {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-weight: bold;
            color: var(--primary);
            width: 160px;
        }

        .role-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .role-selector select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-weight: bold;
            color: var(--primary);
            background: #f8fafc;
        }

        /* Dashboard Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }

        @media(max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .card h3 {
            margin-bottom: 15px;
            color: var(--text-main);
            font-size: 1.2rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn-small {
            background: #0ea5e9;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-ceo { background: #fee2e2; color: #991b1b; }
        .badge-manager { background: #e0e7ff; color: #3730a3; }
        .badge-accountant { background: #d1fae5; color: #065f46; }
        .badge-worker { background: #fef3c7; color: #92400e; }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .nav-back:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">&larr; Back to Toolify Home</a>

        <!-- Header with Multi-Company Config -->
        <header>
            <div class="logo-area">
                <h1>🏢 <span id="displayCompanyName">Toolify Enterprise</span> ERP</h1>
                <p>Multi-Company Isolated Workforce & Officer Tracking</p>
            </div>
            
            <div class="company-setup-box">
                <label for="companyInput" style="margin:0; font-size:0.85rem;">Company:</label>
                <input type="text" id="companyInput" value="Default Company" placeholder="Enter Company Name">
                <button class="btn-small" onclick="switchCompany()">Load</button>
            </div>

            <div class="role-selector">
                <label for="activeRole">View:</label>
                <select id="activeRole" onchange="filterRoleView()">
                    <option value="ALL">CEO Master View</option>
                    <option value="Plant Manager">Plant Manager</option>
                    <option value="Accountant">Accountant</option>
                    <option value="HR Officer">HR Officer</option>
                </select>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Left Column: Add / Assign Record Form -->
            <div>
                <div class="card">
                    <h3>➕ Assign Officer / Worker Task</h3>
                    
                    <div class="form-group">
                        <label>Staff Name:</label>
                        <input type="text" id="staffName" placeholder="e.g., Zahid Khan">
                    </div>

                    <div class="form-group">
                        <label>Designation / Role:</label>
                        <select id="staffRole">
                            <option value="Plant Manager">Plant Manager</option>
                            <option value="Accountant">Accountant</option>
                            <option value="HR Officer">HR Officer</option>
                            <option value="Floor Worker">Floor Worker</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Assigned Department:</label>
                        <select id="staffDept">
                            <option value="Production & Plant">Production & Plant</option>
                            <option value="Finance & Accounts">Finance & Accounts</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Store & Operations">Store & Operations</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Current Task / Responsibility:</label>
                        <textarea id="staffTask" rows="2" placeholder="e.g., Monitoring machinery outputs"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Check-in Time (Arrival):</label>
                        <input type="text" id="checkInTime" placeholder="e.g., 08:30 AM">
                    </div>

                    <button class="btn" onclick="addCompanyRecord()">Add Record to System</button>
                </div>
            </div>

            <!-- Right Column: Live Company Master & Department Reports -->
            <div>
                <div class="card">
                    <h3 id="tableTitle">📊 Company Master Log (All Departments)</h3>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name & Role</th>
                                    <th>Department</th>
                                    <th>Current Task</th>
                                    <th>Arrival</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="companyTableBody">
                                <!-- Dynamic rows will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentCompanyKey = "Default Company";
        let enterpriseData = {};

        // Load data from LocalStorage based on Company Name
        function loadCompanyData() {
            const savedCompany = localStorage.getItem('active_company_name') || "Default Company";
            document.getElementById('companyInput').value = savedCompany;
            document.getElementById('displayCompanyName').innerText = savedCompany;
            currentCompanyKey = "erp_data_" + savedCompany.trim().toLowerCase().replace(/\s+/g, '_');

            const storedData = localStorage.getItem(currentCompanyKey);
            if (storedData) {
                enterpriseData = JSON.parse(storedData);
            } else {
                // Default dummy data if company has no records yet
                enterpriseData = [
                    { name: "Ali Raza", role: "Plant Manager", dept: "Production & Plant", task: "Supervising automated assembly line", time: "08:00 AM" },
                    { name: "Bilal Ahmed", role: "Accountant", dept: "Finance & Accounts", task: "Auditing monthly ledger and invoices", time: "09:00 AM" }
                ];
                saveCompanyData();
            }
            filterRoleView();
        }

        function saveCompanyData() {
            localStorage.setItem(currentCompanyKey, JSON.stringify(enterpriseData));
        }

        function switchCompany() {
            const companyName = document.getElementById('companyInput').value.trim();
            if(!companyName) {
                alert("Please enter a valid company name!");
                return;
            }
            localStorage.setItem('active_company_name', companyName);
            loadCompanyData();
        }

        function renderTable(dataToDisplay) {
            const tbody = document.getElementById('companyTableBody');
            tbody.innerHTML = "";

            if(dataToDisplay.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No records found for this company view.</td></tr>`;
                return;
            }

            dataToDisplay.forEach((item, index) => {
                let badgeClass = "badge-worker";
                if(item.role === "CEO") badgeClass = "badge-ceo";
                else if(item.role.includes("Manager")) badgeClass = "badge-manager";
                else if(item.role === "Accountant") badgeClass = "badge-accountant";

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <strong>${item.name}</strong><br>
                            <span class="badge ${badgeClass}">${item.role}</span>
                        </td>
                        <td>${item.dept}</td>
                        <td>${item.task}</td>
                        <td><span class="status-dot"></span>${item.time}</td>
                        <td>
                            <button onclick="deleteRecord(${index})" style="background: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">Remove</button>
                        </td>
                    </tr>
                `;
            });
        }

        function addCompanyRecord() {
            const name = document.getElementById('staffName').value.trim();
            const role = document.getElementById('staffRole').value;
            const dept = document.getElementById('staffDept').value;
            const task = document.getElementById('staffTask').value.trim();
            const time = document.getElementById('checkInTime').value.trim();

            if(!name || !task || !time) {
                alert("Please fill in all required fields!");
                return;
            }

            enterpriseData.push({ name, role, dept, task, time });
            saveCompanyData();
            
            // Reset form fields
            document.getElementById('staffName').value = "";
            document.getElementById('staffTask').value = "";
            document.getElementById('checkInTime').value = "";

            filterRoleView();
        }

        function deleteRecord(index) {
            enterpriseData.splice(index, 1);
            saveCompanyData();
            filterRoleView();
        }

        function filterRoleView() {
            const selectedRole = document.getElementById('activeRole').value;
            const titleElem = document.getElementById('tableTitle');
            const companyName = document.getElementById('companyInput').value;

            if(selectedRole === "ALL") {
                titleElem.innerText = `📊 ${companyName} - Master Log (All Departments)`;
                renderTable(enterpriseData);
            } else {
                titleElem.innerText = `📊 ${companyName} - Department Log (${selectedRole} View)`;
                const filtered = enterpriseData.filter(item => item.role === selectedRole);
                renderTable(filtered);
            }
        }

        // Load data on page load
        window.onload = function() {
            loadCompanyData();
        };
    </script>
</body>
</html>
